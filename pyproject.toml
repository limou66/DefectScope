[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defectscope"
version = "0.1.0"
description = "Auditable visual anomaly detection with spatial reliability and normal-only calibration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
deep = ["torch>=2.6,<3", "torchvision>=0.21,<1"]

[project.scripts]
defectscope = "defectscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
defectscope = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
